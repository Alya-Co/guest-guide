<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Digital Guest Guide</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700&family=Cormorant:ital,wght@1,500;1,600&display=swap">
<style>
/* Layout: deep-sea hero with two phones, then light "paper" sections; designs as a 2x2 gallery of phones; closing sea band with the WhatsApp call. Salt-lake pink is the only accent. */
:root{
  --sea:#0E3A50; --sea-2:#14485F; --on-sea:#F3EEEA; --on-sea-muted:#B9CCD5;
  --salt:#E7A9B2; --accent:#B8566A;
  --paper:#F7F5F3; --page:#FFFFFF; --ink:#13202A; --muted:#56646C; --rule:#E2DEDA;
  --f-body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-display:"Cormorant","Iowan Old Style",Georgia,serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --sea:#0A2B3B; --sea-2:#103747; --paper:#0F1519; --page:#162027; --ink:#ECE7E3; --muted:#A1ADB4; --rule:#27333B; --accent:#E39AA7; color-scheme:dark}}
:root[data-theme="dark"]{
  --sea:#0A2B3B; --sea-2:#103747; --paper:#0F1519; --page:#162027; --ink:#ECE7E3; --muted:#A1ADB4; --rule:#27333B; --accent:#E39AA7; color-scheme:dark}

body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sea)}
.in{max-width:1120px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
a{color:inherit}
:focus-visible{outline:2px solid var(--salt);outline-offset:3px;border-radius:6px}
h2{font-size:clamp(30px,4.4vw,46px);line-height:1.1;letter-spacing:-.01em;margin:0;text-wrap:balance}
h2 em{font-family:var(--f-display);font-weight:600;color:var(--accent)}
.kicker{font-size:13px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
section{padding-block:72px}
@media (max-width:700px){section{padding-block:52px}}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--sea);color:var(--on-sea);border-bottom:1px solid rgba(255,255,255,.08)}
.bar .in{display:flex;align-items:center;gap:16px;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;margin-right:auto;text-decoration:none}
.brand i{width:12px;height:12px;border-radius:50%;background:var(--salt)}
.langs{display:flex;gap:2px}
.langs button{font:500 13px/1 var(--f-body);letter-spacing:.06em;color:var(--on-sea-muted);background:none;border:0;padding:9px 8px;border-radius:8px;cursor:pointer}
.langs button[aria-pressed="true"]{color:var(--on-sea);background:rgba(255,255,255,.1)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;font:700 16px/1.2 var(--f-body);text-decoration:none;border-radius:999px;padding:15px 24px;cursor:pointer;border:0;text-align:center}
.btn-salt{background:var(--salt);color:#0E3A50}
.btn-line{border:1px solid rgba(243,238,234,.45);color:var(--on-sea)}
.bar .btn{padding:11px 18px;font-size:14px}
@media (max-width:640px){.bar .btn{display:none}}

/* hero */
.hero{background:var(--sea);color:var(--on-sea);overflow:hidden}
.hero .in{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:40px;align-items:center;padding-block:64px 0}
.hero .kicker{color:var(--salt)}
.hero h1{margin:18px 0 0;font-size:clamp(36px,5.6vw,64px);line-height:1.05;letter-spacing:-.015em;text-wrap:balance}
.hero h1 span{display:block;margin-top:8px;font-family:var(--f-display);font-style:italic;font-weight:600;color:var(--salt);font-size:1.18em;line-height:1}
.lead{margin:22px 0 0;font-size:20px;line-height:1.5;color:var(--on-sea-muted);max-width:34em}
.ctas{margin-top:30px;display:flex;flex-wrap:wrap;gap:12px}
.note{margin:14px 0 0;font-size:14px;color:var(--on-sea-muted)}
.phones{position:relative;height:560px;align-self:end}
.phone{position:absolute;bottom:-40px;width:260px;aspect-ratio:390/800;border:10px solid #0B1F2A;border-radius:42px;overflow:hidden;background:#fff;box-shadow:0 30px 60px rgba(0,0,0,.35)}
.phone img{display:block;width:100%;height:100%;object-fit:cover;object-position:top}
.phone.a{left:6%;transform:rotate(-5deg)}
.phone.b{right:4%;bottom:-10px;transform:rotate(4deg)}
@media (max-width:860px){
  .hero .in{grid-template-columns:minmax(0,1fr);padding-block:44px 0}
  .phones{height:420px;max-width:440px;width:100%;margin:0 auto}
  .phone{width:200px;border-radius:34px;border-width:8px}
}

/* blocks */
.grid4{margin-top:36px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
@media (max-width:960px){.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.grid4{grid-template-columns:minmax(0,1fr)}}
.item{background:var(--page);border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:8px}
.item b{font-size:19px;line-height:1.25}
.item p{margin:0;color:var(--muted);font-size:16px}
.item .no{font-family:var(--f-display);font-style:italic;font-weight:600;font-size:34px;line-height:1;color:var(--accent)}

.split{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:48px}
@media (max-width:860px){.split{grid-template-columns:minmax(0,1fr);gap:24px}}
.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:6px 28px;padding:18px 0;border-top:1px solid var(--rule)}
.row:last-child{border-bottom:1px solid var(--rule)}
.row b{font-size:19px;line-height:1.3}
.row p{margin:0;color:var(--muted)}
@media (max-width:560px){.row{grid-template-columns:minmax(0,1fr)}}

/* designs */
.designs{background:var(--page)}
.dsub{margin:14px 0 0;color:var(--muted);max-width:40em}
.dgrid{margin-top:40px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
@media (max-width:760px){.dgrid{grid-template-columns:minmax(0,1fr)}}
.design{display:grid;grid-template-columns:150px minmax(0,1fr);gap:22px;align-items:start;background:var(--paper);border-radius:24px;padding:22px}
.design .ph{width:150px;aspect-ratio:390/600;border:7px solid var(--ink);border-radius:26px;overflow:hidden;background:#fff}
.design .ph img{display:block;width:100%;height:100%;object-fit:cover;object-position:top}
.design h3{margin:0;font-family:var(--f-display);font-style:italic;font-weight:600;font-size:40px;line-height:1}
.design p{margin:10px 0 0;font-size:16px}
.design .for{margin-top:10px;font-size:14px;color:var(--muted)}
.design .btn{margin-top:16px;padding:12px 18px;font-size:15px;background:var(--ink);color:var(--page)}
@media (max-width:420px){.design{grid-template-columns:minmax(0,1fr)}.design .ph{width:170px}}
.dnote{margin:20px 0 0;font-size:14px;color:var(--muted)}

/* steps + final cta */
.final{background:var(--sea);color:var(--on-sea)}
.final h2 em{color:var(--salt)}
.steps{margin-top:36px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;counter-reset:s}
@media (max-width:860px){.steps{grid-template-columns:minmax(0,1fr)}}
.step{background:var(--sea-2);border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:8px}
.step .no{font-family:var(--f-display);font-style:italic;font-weight:600;font-size:44px;line-height:1;color:var(--salt)}
.step b{font-size:20px}
.step p{margin:0;color:var(--on-sea-muted)}
.cta-box{margin-top:36px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:20px;background:var(--on-sea);color:#0E3A50;border-radius:28px;padding:28px 32px}
.cta-box b{font-size:clamp(22px,2.6vw,30px);line-height:1.2;max-width:22em}
.cta-box .num{display:block;margin-top:6px;font-size:16px;font-weight:500;color:#3D5A69;user-select:all}
.cta-box .btn{background:#0E3A50;color:var(--on-sea);font-size:18px;padding:18px 28px}

/* faq */
details{border-top:1px solid var(--rule)}
details:last-child{border-bottom:1px solid var(--rule)}
summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:20px;align-items:center;padding:20px 0;font-size:19px;font-weight:500}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-size:26px;font-weight:400;color:var(--accent);flex:none}
details[open] summary::after{content:"–"}
details p{margin:0 0 20px;color:var(--muted);max-width:44em}
footer{padding-block:28px 40px;font-size:14px;color:var(--muted)}
footer .in{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
</style>

<div class="bar"><div class="in">

<section><div class="in">

<section style="padding-top:0"><div class="in split">

<section style="padding-top:0"><div class="in split">

<section class="designs" id="designs"><div class="in">

  <p class="dsub" data-t="desSub"></p>
  <div class="dgrid" id="dgrid"></div>
  <p class="dnote" data-t="desNote"></p>
</div></section>

<section class="final" id="how"><div class="in">
  <div class="kicker" style="color:var(--salt)" data-t="howK"></div>
  <h2 data-t="howT" style="margin-top:12px"></h2>
  <div class="steps" id="steps"></div>
  <div class="cta-box">
    <div><b data-t="ctaBig"></b><span class="num">WhatsApp +34 602 50 90 14</span></div>
    <a class="btn wa" target="_blank" rel="noopener" data-t="ctaBtn"></a>
  </div>
</div></section>

<section id="faq"><div class="in split">
  <div><div class="kicker" data-t="faqK"></div><h2 data-t="faqT" style="margin-top:12px"></h2></div>
  <div id="faqList"></div>
</div></section>

<footer><div class="in"><span data-t="foot"></span><span>WhatsApp +34 602 50 90 14</span></div></footer>

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let lang = "en";
try { const s = localStorage.getItem("gg-landing-lang"); if (s && S[s]) lang = s; } catch(e) {}
{ const h = location.hash.slice(1); if (S[h]) lang = h; }

function render(){
  const t = S[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(el => { el.textContent = t[el.dataset.t]; });
  document.querySelectorAll(".langs button").forEach(b => b.setAttribute("aria-pressed", b.dataset.l === lang));
  const wa = "https://wa.me/" + WA + "?text=" + encodeURIComponent(t.wa);
  document.querySelectorAll("a.wa").forEach(a => a.href = wa);
  document.getElementById("included").innerHTML = t.inc.map(([b,p]) => `<div class="item"><b>${esc(b)}</b><p>${esc(p)}</p></div>`).join("");
  document.getElementById("who").innerHTML = t.who.map(([b,p]) => `<div class="row"><b>${esc(b)}</b><p>${esc(p)}</p></div>`).join("");
  document.getElementById("why").innerHTML = t.why.map(([b,p]) => `<div class="row"><b>${esc(b)}</b><p>${esc(p)}</p></div>`).join("");
  document.getElementById("dgrid").innerHTML = t.des.map(([k,n,d,f]) => `<article class="design"><div class="ph"><img src="${IMG[k]}" alt="${esc(n)}"></div><div><h3>${esc(n)}</h3><p>${esc(d)}</p><div class="for">${esc(f)}</div><a class="btn" href="demo-${k}.html#${lang}" target="_blank" rel="noopener">${esc(t.open)} ↗</a></div></article>`).join("");
  document.getElementById("steps").innerHTML = t.steps.map(([b,p],i) => `<div class="step"><span class="no">${i+1}</span><b>${esc(b)}</b><p>${esc(p)}</p></div>`).join("");
  document.getElementById("faqList").innerHTML = t.faq.map(([q,a]) => `<details><summary>${esc(q)}</summary><p>${esc(a)}</p></details>`).join("");
}
document.querySelectorAll(".langs button").forEach(b => b.addEventListener("click", () => {
  lang = b.dataset.l;
  try { localStorage.setItem("gg-landing-lang", lang); } catch(e) {}
  render();
}));
render();
</script>
