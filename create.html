<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Create Your Guest Guide</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700&family=Cormorant:ital,wght@1,500;1,600&display=swap">
<style>
/* Layout: form column on the left, sticky phone preview on the right; one column on phones. Same sea + salt palette as the landing. */
:root{
  --sea:#0E3A50; --on-sea:#F3EEEA; --on-sea-muted:#B9CCD5; --salt:#E7A9B2; --accent:#B8566A;
  --paper:#F7F5F3; --page:#FFFFFF; --ink:#13202A; --muted:#56646C; --rule:#E2DEDA; --field:#FFFFFF;
  --ok:#2F7A4F; --bad:#B23A3A;
  --f-body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-display:"Cormorant","Iowan Old Style",Georgia,serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --sea:#0A2B3B; --paper:#0F1519; --page:#162027; --ink:#ECE7E3; --muted:#A1ADB4; --rule:#2A363E; --field:#101A20; --accent:#E39AA7; --ok:#6CC08F; --bad:#E58A8A; color-scheme:dark}}
:root[data-theme="dark"]{
  --sea:#0A2B3B; --paper:#0F1519; --page:#162027; --ink:#ECE7E3; --muted:#A1ADB4; --rule:#2A363E; --field:#101A20; --accent:#E39AA7; --ok:#6CC08F; --bad:#E58A8A; color-scheme:dark}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sea)}
.in{max-width:1180px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--sea);color:var(--on-sea)}
.bar .in{display:flex;align-items:center;gap:14px;padding-block:12px}
.bar a.back{color:var(--on-sea-muted);text-decoration:none;font-size:14px;margin-right:auto}
.langs{display:flex;gap:2px}
.langs button{font:500 13px/1 var(--f-body);color:var(--on-sea-muted);background:none;border:0;padding:9px 8px;border-radius:8px;cursor:pointer}
.langs button[aria-pressed="true"]{color:var(--on-sea);background:rgba(255,255,255,.1)}
header.top{background:var(--sea);color:var(--on-sea)}
header.top .in{padding-block:36px 40px}
header.top h1{margin:0;font-size:clamp(30px,4.6vw,48px);line-height:1.1;text-wrap:balance}
header.top h1 em{font-family:var(--f-display);font-weight:600;color:var(--salt)}
header.top p{margin:14px 0 0;color:var(--on-sea-muted);max-width:46em;font-size:18px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:40px;align-items:start;padding-block:36px 64px}
@media (max-width:980px){.layout{grid-template-columns:minmax(0,1fr)}}
fieldset{border:0;margin:0 0 28px;padding:0;min-width:0}
legend{font-size:22px;font-weight:700;padding:0;margin-bottom:14px}
.hint{margin:-6px 0 14px;color:var(--muted);font-size:14px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:560px){.grid2{grid-template-columns:minmax(0,1fr)}}
label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:500;min-width:0}
label.f.full{grid-column:1/-1}
input[type=text],input[type=time],select,textarea{font:400 16px/1.4 var(--f-body);color:var(--ink);background:var(--field);border:1px solid var(--rule);border-radius:12px;padding:12px 14px;width:100%;box-sizing:border-box}
textarea{min-height:110px;resize:vertical}
.small{font-size:13px;color:var(--muted);font-weight:400}
.designs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:640px){.designs{grid-template-columns:repeat(2,minmax(0,1fr))}}
.designs label{position:relative;display:flex;flex-direction:column;gap:8px;align-items:center;background:var(--page);border:2px solid transparent;border-radius:16px;padding:10px;cursor:pointer;font-weight:600;font-size:14px}
.designs input{position:absolute;opacity:0;pointer-events:none}
.designs img{width:100%;aspect-ratio:390/520;object-fit:cover;object-position:top;border-radius:10px;border:1px solid var(--rule)}
.designs label:has(input:checked){border-color:var(--accent)}
.designs label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;font:700 16px/1.2 var(--f-body);border-radius:999px;padding:15px 24px;border:0;cursor:pointer;text-decoration:none}
.btn-main{background:var(--sea);color:var(--on-sea)}
.btn-salt{background:var(--salt);color:#0E3A50}
.btn-line{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn[disabled]{opacity:.55;cursor:default}
.side{position:sticky;top:76px;display:flex;flex-direction:column;gap:14px}
@media (max-width:980px){.side{position:static}}
.phone{width:min(100%,390px);margin:0 auto;aspect-ratio:390/760;border:10px solid #0B1F2A;border-radius:44px;overflow:hidden;background:var(--page);position:relative}
.phone iframe{width:100%;height:100%;border:0;display:block;background:#fff}
.phone .empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;color:var(--muted);font-size:15px}
.notice{background:var(--page);border-radius:16px;padding:14px 16px;font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.notice b{color:var(--ink)}
.send{background:var(--page);border-radius:24px;padding:22px;display:flex;flex-direction:column;gap:14px}
.send h2{margin:0;font-size:22px}
.acts{display:flex;flex-wrap:wrap;gap:10px}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--muted)}
.consent input{width:20px;height:20px;margin:1px 0 0;flex:none;accent-color:var(--accent)}
.consent a{color:var(--ink)}
.status{font-size:15px;font-weight:500;min-height:1.4em}
.status.ok{color:var(--ok)} .status.bad{color:var(--bad)}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
#changesBox[hidden]{display:none}
</style>

<div class="bar"><div class="in">
  <a class="back" href="index.html" id="backLink" data-t="back"></a>
  <div class="langs" role="group" aria-label="Language">
    <button type="button" data-l="en">EN</button><button type="button" data-l="ru">RU</button><button type="button" data-l="pl">PL</button><button type="button" data-l="es">ES</button>
  </div>
</div></div>

<header class="top"><div class="in">
  <h1 id="h1"></h1>
  <p data-t="lead"></p>
</div></header>

<main class="in layout">
  <form id="form" novalidate>
    <fieldset>
      <legend data-t="s1"></legend>
      <div class="designs" id="designs"></div>
    </fieldset>

    <fieldset>
      <legend data-t="s2"></legend>
      <div class="grid2">
        <label class="f full"><span data-t="f_name"></span><input type="text" id="f_name" maxlength="80"></label>
        <label class="f full"><span data-t="f_addr"></span><input type="text" id="f_addr" maxlength="200"></label>
        <label class="f"><span data-t="f_in"></span><input type="time" id="f_in"></label>
        <label class="f"><span data-t="f_out"></span><input type="time" id="f_out"></label>
        <label class="f"><span data-t="f_ssid"></span><input type="text" id="f_ssid" maxlength="60"></label>
        <label class="f"><span data-t="f_pass"></span><input type="text" id="f_pass" maxlength="60" autocomplete="off"></label>
        <p class="small full" style="grid-column:1/-1;margin:0" data-t="passNote"></p>
        <label class="f"><span data-t="f_binsM"></span><input type="number" id="f_binsM" min="0" max="5000" step="5" inputmode="numeric"></label>
        <label class="f"><span data-t="f_binsWhere"></span><input type="text" id="f_binsWhere" maxlength="120"></label>
        <label class="f"><span data-t="f_host"></span><input type="text" id="f_host" maxlength="60"></label>
        <label class="f"><span data-t="f_hosp"></span><input type="text" id="f_hosp" maxlength="120"></label>
      </div>
    </fieldset>

    <fieldset>
      <legend data-t="s3"></legend>
      <p class="hint" data-t="hint"></p>
      <div class="grid2">
        <label class="f full"><span data-t="f_arrive"></span><textarea id="f_arrive" maxlength="1500"></textarea></label>
        <label class="f full"><span data-t="f_home"></span><textarea id="f_home" maxlength="1500"></textarea></label>
        <label class="f"><span data-t="f_rules"></span><textarea id="f_rules" maxlength="1000"></textarea></label>
        <label class="f"><span data-t="f_leave"></span><textarea id="f_leave" maxlength="1000"></textarea></label>
        <label class="f"><span data-t="f_near"></span><textarea id="f_near" maxlength="1500"></textarea></label>
        <label class="f"><span data-t="f_eat"></span><textarea id="f_eat" maxlength="1000"></textarea></label>
        <label class="f full"><span data-t="f_road"></span><textarea id="f_road" maxlength="1000"></textarea></label>
      </div>
    </fieldset>

    <button type="button" class="btn btn-main" id="showBtn" data-t="show"></button>

    <section class="send" id="sendBox" style="margin-top:32px">
      <h2 data-t="s5"></h2>
      <div class="grid2">
        <label class="f"><span data-t="f_you"></span><input type="text" id="f_you" maxlength="80" autocomplete="name"></label>
        <label class="f"><span data-t="f_method"></span>
          <select id="f_method"><option>WhatsApp</option><option>Email</option><option>Telegram</option></select></label>
        <label class="f full"><span data-t="f_contact"></span><input type="text" id="f_contact" maxlength="120"></label>
        <div id="changesBox" hidden style="grid-column:1/-1"><label class="f"><span data-t="f_changes"></span><textarea id="f_changes" maxlength="1500"></textarea></label></div>
      </div>
      <label class="hp" aria-hidden="true">Website<input type="text" id="website" tabindex="-1" autocomplete="off"></label>
      <label class="consent"><input type="checkbox" id="f_consent"><span><span data-t="consent"></span> <a href="privacy.html" target="_blank" rel="noopener" id="privacyLink" data-t="privacy"></a></span></label>
      <div class="acts">
        <button type="button" class="btn btn-salt" id="wantBtn" data-t="want"></button>
        <button type="button" class="btn btn-line" id="changesBtn" data-t="changes"></button>
      </div>
      <div class="status" id="status" role="status" aria-live="polite"></div>
    </section>
  </form>

  <aside class="side">
    <div class="phone" id="phone">
      <div class="empty" id="empty" data-t="empty"></div>
    </div>
    <div class="notice"><b data-t="prevNote"></b><span data-t="exNote"></span><span data-t="fullNote"></span></div>
  </aside>
</main>

const TEXT_FIELDS = ["f_name","f_addr","f_in","f_out","f_ssid","f_pass","f_binsM","f_binsWhere","f_host","f_hosp","f_arrive","f_home","f_rules","f_leave","f_near","f_eat","f_road"];
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $ = id => document.getElementById(id);
let lang = "en", design = "app", shown = false, changesMode = false;
try { const s = localStorage.getItem("gg-landing-lang"); if (L[s]) lang = s; } catch(e) {}
{ const h = location.hash.slice(1); if (L[h]) lang = h; }

function renderUI(){
  const t = L[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(el => { if (typeof t[el.dataset.t] === "string") el.textContent = t[el.dataset.t]; });
  $("h1").innerHTML = esc(t.h1a) + "<em>" + esc(t.h1b) + "</em>";
  document.querySelectorAll(".langs button").forEach(b => b.setAttribute("aria-pressed", b.dataset.l === lang));
  $("backLink").href = "index.html#" + lang;
  for (const k in t.ph) $(k).placeholder = t.ph[k];
  $("designs").innerHTML = DESIGNS.map(([k,img]) => `<label><input type="radio" name="design" value="${k}" ${k===design?"checked":""}><img src="${img}" alt="" onerror="this.src='img/${k}.png'">${esc(t.dn[k])}</label>`).join("");
  document.querySelectorAll('input[name=design]').forEach(r => r.addEventListener("change", () => { design = r.value; if (shown) preview(); }));
  $("changesBtn").textContent = changesMode ? t.sendChanges : t.changes;
  if (shown) preview();
}

/* "Title: text" lines -> [title, text] */
const pairs = v => v.split("\n").map(s => s.trim()).filter(Boolean).map(s => {
  const m = s.match(/^(.{1,45}?)(?:\s*:\s+|\s+[-–—]\s+)(.+)$/);
  return m ? [m[1].trim(), m[2].trim()] : ["", s];
});
const BINS = {
  ru:(m,w) => m && w ? `Контейнеры в ${m} м от дома: ${w}.` : m ? `Контейнеры в ${m} м от дома.` : w ? `Контейнеры: ${w}.` : "Контейнеры для раздельного сбора мусора рядом с домом.",
  en:(m,w) => m && w ? `The bins are ${m} m from the building: ${w}.` : m ? `The bins are ${m} m from the building.` : w ? `The bins: ${w}.` : "Recycling bins are near the building.",
  pl:(m,w) => m && w ? `Kontenery są ${m} m od budynku: ${w}.` : m ? `Kontenery są ${m} m od budynku.` : w ? `Kontenery: ${w}.` : "Kontenery do segregacji są w pobliżu budynku.",
  es:(m,w) => m && w ? `Los contenedores están a ${m} m del edificio: ${w}.` : m ? `Los contenedores están a ${m} m del edificio.` : w ? `Contenedores: ${w}.` : "Los contenedores de reciclaje están cerca del edificio."
};
const town = () => { const p = $("f_addr").value.split(",").map(s => s.trim()).filter(Boolean); return p.length ? p[p.length-1].replace(/^\d{5}\s*/, "") : ""; };

function patch(){
  const t = L[lang], tw = town(), q = n => tw ? n + ", " + tw : n;
  const P = {lang, apt:{}, t:{}, eat:null, hosp:$("f_hosp").value.trim()};
  P.apt.name = $("f_name").value.trim() || t.defName;
  if ($("f_addr").value.trim()) P.apt.addr = $("f_addr").value.trim();
  P.apt.checkin = $("f_in").value || "16:00";
  P.apt.checkout = $("f_out").value || "11:00";
  P.apt.wifi = {ssid: $("f_ssid").value.trim() || "—", pass: $("f_pass").value.trim() || "••••••"};
  P.apt.host = {name: $("f_host").value.trim() || "—", phone: t.hiddenPhone, wa: ""};
  const host = $("f_host").value.trim(); if (host) P.t.hostName = host;
  for (const [f,key] of [["f_arrive","arrive"],["f_home","home"],["f_rules","rules"],["f_road","road"]]) {
    const v = pairs($(f).value); if (v.length) P.t[key] = v.map(([a,b]) => [a, b]);
  }
  const lv = $("f_leave").value.split("\n").map(s => s.trim()).filter(Boolean); if (lv.length) P.t.leave = lv;
  const nr = pairs($("f_near").value); if (nr.length) P.t.near = nr.map(([a,b]) => [a, b, q(a || b.slice(0, 50))]);
  const et = pairs($("f_eat").value);
  if (et.length) P.eat = et.map(([title, text]) => ["", title, text, q(title || text.slice(0, 50))]);
  const bm = $("f_binsM").value.trim(), bw = $("f_binsWhere").value.trim().replace(/[.。]$/, "");
  P.bins = BINS[lang](bm, bw);
  return P;
}

const cache = {};
async function demoSource(k){
  if (cache[k]) return cache[k];
  for (const url of [`demo-${k}.html`, `demo/${k}.html`]) {
    try { const r = await fetch(url); if (r.ok) return cache[k] = await r.text(); } catch(e) {}
  }
  throw new Error("demo not found");
}

const OVERLAY = `<style>
#__demo-mark{position:fixed;inset:0;pointer-events:none;z-index:99999;display:flex;align-items:center;justify-content:center;overflow:hidden}
#__demo-mark span{transform:rotate(-30deg);font:800 88px/1 system-ui,sans-serif;letter-spacing:.08em;color:rgba(184,86,106,.16);white-space:nowrap}
</style><div id="__demo-mark" aria-hidden="true"><span>__MARK__</span></div>`;

async function preview(){
  const t = L[lang];
  let src;
  try { src = await demoSource(design); } catch(e) { $("empty").textContent = t.err; return; }
  const P = patch();
  const inject = `{ const P = ${JSON.stringify(P).replace(/</g,"\\u003c")};
    Object.assign(APT, P.apt);
    for (const k in T) { Object.assign(T[k], P.t); T[k].binsIntro = P.bins; if (!P.t.leave && T[k].leave) T[k].leave = T[k].leave.map(x => x.replace(/ (на углу|на розі|on the corner|na rogu|de la esquina|au coin|op de hoek|på hörnet)/, "")); if (P.hosp && T[k].sos && T[k].sos[2]) T[k].sos[2] = [T[k].sos[2][0], P.hosp, P.hosp]; }
    if (P.eat && typeof EAT !== "undefined") for (const k in EAT) EAT[k].items = P.eat;
    if (T[P.lang]) lang = P.lang; }
render();`;
  let html = src
    .replace("{ const h = location.hash.slice(1); if (T[h]) lang = h; }\nrender();", inject)
    .replace("<h1>Mar Salado</h1>", "<h1>${esc(APT.name)}</h1>")
    .replace("<b>Mar Salado · Guest Journal</b>", "<b>Guest Journal</b>")
    .replace(/<script>if \("serviceWorker"[\s\S]*?<\/script>/, "")
    .replace("</body>", OVERLAY.replace("__MARK__", lang === "ru" ? "ДЕМО" : "DEMO") + "</body>");
  let fr = $("phone").querySelector("iframe");
  if (!fr) {
    fr = document.createElement("iframe");
    fr.setAttribute("sandbox", "allow-scripts allow-popups");
    fr.setAttribute("title", "Preview");
    $("phone").appendChild(fr);
  }
  $("empty").hidden = true;
  fr.srcdoc = html;
  shown = true;
}

$("showBtn").addEventListener("click", () => { preview(); if (matchMedia("(max-width: 980px)").matches) $("phone").scrollIntoView({behavior:"smooth", block:"start"}); });
let timer;
document.querySelectorAll("#form input[type=text], #form input[type=time], #form input[type=number], #form textarea").forEach(el => el.addEventListener("input", () => {
  if (!shown || el.closest("#sendBox")) return;
  clearTimeout(timer); timer = setTimeout(preview, 600);
}));

function setStatus(msg, cls){ const s = $("status"); s.textContent = msg; s.className = "status " + (cls || ""); }

async function send(kind){
  const t = L[lang];
  if (!$("f_contact").value.trim()) { setStatus(t.needContact, "bad"); $("f_contact").focus(); return; }
  if (kind === "changes" && !$("f_changes").value.trim()) { setStatus(t.needChanges, "bad"); $("f_changes").focus(); return; }
  if (!$("f_consent").checked) { setStatus(t.needConsent, "bad"); return; }
  if (!ENDPOINT) { setStatus(t.off, "bad"); return; }
  const fields = TEXT_FIELDS.map(id => [document.querySelector(`[data-t="${id}"]`).textContent, $(id).value.trim()]).filter(([,v]) => v);
  fields.unshift([t.s1.replace(/^\d\.\s*/,""), t.dn[design]]);
  const body = {kind, lang, name: $("f_you").value.trim(), method: $("f_method").value, contact: $("f_contact").value.trim(),
    changes: $("f_changes").value.trim(), fields, website: $("website").value};
  const btns = [$("wantBtn"), $("changesBtn")]; btns.forEach(b => b.disabled = true); setStatus(t.sending);
  try {
    const r = await fetch(ENDPOINT, {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(body)});
    if (!r.ok) throw new Error(r.status);
    setStatus(kind === "changes" ? t.okUrgent : t.ok, "ok");
  } catch(e) { setStatus(t.err, "bad"); }
  btns.forEach(b => b.disabled = false);
}
$("wantBtn").addEventListener("click", () => send("lead"));
$("changesBtn").addEventListener("click", () => {
  if (!changesMode) { changesMode = true; $("changesBox").hidden = false; $("changesBtn").textContent = L[lang].sendChanges; $("f_changes").focus(); return; }
  send("changes");
});
document.querySelectorAll(".langs button").forEach(b => b.addEventListener("click", () => {
  lang = b.dataset.l; try { localStorage.setItem("gg-landing-lang", lang); } catch(e) {} renderUI();
}));
renderUI();
</script>
