.bins{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

.check label:last-child{border-bottom:1px solid var(--line)}

.check input:checked+span{color:var(--muted);text-decoration:line-through}

.places{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:10px}
.place{padding:14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.place span{font-size:15px;color:var(--muted)}

.sos li b{font-family:var(--f-mono);font-size:18px;color:var(--lagoon)}
.maplink{align-self:flex-start;margin-top:4px;font-size:14px;font-weight:600;text-decoration:none;border-bottom:1px solid currentColor}

.extras{margin-top:28px;padding:18px;border-radius:16px;border:1px dashed var(--sea);display:flex;flex-direction:column;gap:12px}
.extras h2{font-family:var(--f-display);font-weight:500;font-size:20px;margin:0}
.extra{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}

const ADDR_Q = () => APT.addr.replace(/ · /g, ", ");

const mapRoute = () => "https://www.google.com/maps/dir/?api=1&destination=" + encodeURIComponent(ADDR_Q());
function copyAddr(btn){
  const a = ADDR[lang];
  const ok = () => { btn.textContent = a.copied; setTimeout(() => btn.textContent = ADDR[lang].copy, 1600); };
  try { navigator.clipboard.writeText(ADDR_Q()).then(ok, () => {}); } catch(e) {}
}
